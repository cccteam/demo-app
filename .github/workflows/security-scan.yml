name: Security Scan

on:
  schedule:
    - cron: '0 14 * * *' # Daily at 8:00 AM CDT
  workflow_dispatch:

jobs:
  security_scan:
    uses: cccteam/github-workflows/.github/workflows/golang-security-scan.yml@v5.12.4
    with:
      slack-channel-id: 'C073V8U8QHE'
      docker-build-args: '["APP_DEPLOYMENT=Prod"]'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.CCC_SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: # Overriding this blank value via the slack-channel-id input
      DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
